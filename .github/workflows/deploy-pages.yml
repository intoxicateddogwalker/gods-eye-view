name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build -- --base=/gods-eye-view/
      - name: Fix Cesium asset path for Pages subpath
        run: |
          # vite-plugin-cesium copies Cesium to dist/<base>/cesium, but the
          # script tag it injects expects it at dist/cesium. Move it up
          # so /gods-eye-view/cesium/Cesium.js resolves on GitHub Pages.
          if [ -d dist/gods-eye-view/cesium ]; then
            mv dist/gods-eye-view/cesium dist/cesium
            rmdir dist/gods-eye-view
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
